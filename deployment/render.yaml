# Example deployment descriptor for Render (render.com) or any platform
# that reads a similar "web service from a subdirectory" config. Adapt
# field names if you're using Railway, Fly.io, or another host — the
# important parts are: root directory = backend/, install requirements,
# and run uvicorn with $PORT.
services:
  - type: web
    name: visionai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: DEFAULT_CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: DEBUG
        value: "false"
